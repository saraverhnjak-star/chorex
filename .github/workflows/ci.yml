name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up pinned Node and cache pnpm store
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          java -version

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint all workspaces
        run: pnpm lint

      - name: Check strict TypeScript types
        run: pnpm typecheck

      - name: Run existing tests
        run: pnpm test

      - name: Build Functions and verify emulator security
        run: pnpm emulators:verify
